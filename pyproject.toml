[project]
name = "omnivoice-fastapi"
version = "0.2.0"
description = "OpenAI-compatible batch speech API backed by OmniVoice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.1",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "pydantic-settings>=2.10",
    "numpy>=1.26",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
# NVIDIA GPU on Linux/WSL (or Windows): k2-fsa/OmniVoice on PyTorch, CUDA 12.8.
cuda = [
    "omnivoice; sys_platform != 'darwin'",
    "torch==2.8.0+cu128; sys_platform != 'darwin'",
    "torchaudio==2.8.0+cu128; sys_platform != 'darwin'",
    # FlashInfer (Linux only) roughly doubles generation speed. Its 1.3 GB JIT-cache wheel stays out
    # of the lock: scripts/run-wsl.sh downloads and installs it (same version) next to this.
    "flashinfer-python==0.6.15.post1; sys_platform == 'linux'",
]
# Apple Silicon: mlx-audio's MLX port of OmniVoice.
mlx = ["mlx-audio>=0.5.7; sys_platform == 'darwin'"]

[dependency-groups]
dev = ["pytest>=8.4", "httpx2>=2.13"]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
omnivoice = { git = "https://github.com/k2-fsa/OmniVoice.git" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["mlx: runs the real MLX model (set OMNIVOICE_TEST_MLX=1)"]

[tool.ruff]
line-length = 100
extend-exclude = ["omnivoice_api/vendor"]
